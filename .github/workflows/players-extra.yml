# Adds the players the main Wikidata fetch misses (record-page and finals
# footballers, lesser-known Premier League squad players, infobox careers for
# players with no dated clubs) to data_pipeline/raw/. Run from the Actions tab
# after fetch-data and lists; then run normalise.py and build_db.py.
name: Fetch extra players

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch extra players
        working-directory: data_pipeline
        run: bash ../scripts/ci_run.sh "Extra players" python3 players_extra_fetch.py
      - name: Commit
        run: |
          git config user.name "quizinho-data-bot"
          git config user.email "quizinho-data-bot@users.noreply.github.com"
          git add data_pipeline/raw/players.json.gz data_pipeline/raw/spells.json.gz data_pipeline/raw/clubs.json.gz data_pipeline/raw/countries.json.gz data_pipeline/raw/FETCHED.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data: extra players (record pages, Premier League squads, infobox careers)"
            git pull --rebase origin main
            git push
          fi
