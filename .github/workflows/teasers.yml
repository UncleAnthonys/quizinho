# Builds the Half-Time Teaser bank: Wikidata picks the candidates, English
# Wikipedia infoboxes must agree on every answer set. Commits
# data_pipeline/seed/teasers.json. Run from the Actions tab.
name: Build teasers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check teasers
        working-directory: data_pipeline
        run: bash ../scripts/ci_run.sh "Teasers" python3 teasers_build.py
      - name: Report
        run: echo "::notice title=Teasers::$(python3 -c "import json;print(json.load(open('data_pipeline/seed/teasers.json'))['_note'])")"
      - name: Commit
        run: |
          git config user.name "quizinho-data-bot"
          git config user.email "quizinho-data-bot@users.noreply.github.com"
          git add data_pipeline/seed/teasers.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data: Half-Time Teasers (checked against Wikipedia)"
            git pull --rebase origin main
            git push
          fi
