# Downloads raw footballer data from Wikidata and commits it to
# data_pipeline/raw/. Run from the Actions tab ("Run workflow"), or monthly.
name: Fetch football data

on:
  workflow_dispatch:
    inputs:
      min_sitelinks:
        description: "Only players covered by at least this many Wikipedias (fame cut-off)"
        default: "15"
      min_sitelinks_women:
        description: "Lower cut-off for women's players"
        default: "5"
      countries_only:
        description: "Only refetch countries (fast)"
        default: "no"
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of each month

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from Wikidata
        run: |
          if [ "${{ github.event.inputs.countries_only }}" = "yes" ]; then
            bash scripts/ci_run.sh "Countries fetch" python3 data_pipeline/wikidata_fetch.py --countries-only
          else
            bash scripts/ci_run.sh "Wikidata fetch" python3 data_pipeline/wikidata_fetch.py --min-sitelinks "${{ github.event.inputs.min_sitelinks || '15' }}" --min-sitelinks-women "${{ github.event.inputs.min_sitelinks_women || '5' }}"
          fi
      - name: Report
        run: echo "::notice title=Fetched::$(cat data_pipeline/raw/FETCHED.txt 2>/dev/null || echo countries only)"
      - name: Commit raw data
        run: |
          git config user.name "quizinho-data-bot"
          git config user.email "quizinho-data-bot@users.noreply.github.com"
          git add data_pipeline/raw
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data: refresh raw Wikidata dump" -m "$(cat data_pipeline/raw/FETCHED.txt)"
            git pull --rebase origin main
            git push
          fi
