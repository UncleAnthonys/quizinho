# Premier League stats feed: probe now, fetch later. Run from the Actions tab.
name: PL stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        working-directory: data_pipeline
        run: python3 pl_stats_probe.py
