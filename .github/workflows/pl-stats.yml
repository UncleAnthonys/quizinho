# Premier League player rankings from the stats feed (raw/pl_stats.json.gz,
# for Top 10). Run from the Actions tab.
name: PL stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        working-directory: data_pipeline
        run: bash ../scripts/ci_run.sh "PL stats" python3 pl_stats_fetch.py
      - name: Commit
        run: |
          git config user.name "quizinho-data-bot"
          git config user.email "quizinho-data-bot@users.noreply.github.com"
          git add data_pipeline/raw/pl_stats.json.gz
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data: Premier League stats rankings"
            git pull --rebase origin main
            git push
          fi
