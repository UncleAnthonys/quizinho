# Fetches the Wikipedia articles of the finals behind the grid's cup-winner
# categories and commits them (data_pipeline/raw/finals_wikitext.json.gz) so
# line-ups can be parsed offline. Run from the Actions tab.
name: Fetch finals

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch finals
        working-directory: data_pipeline
        run: bash ../scripts/ci_run.sh "Finals" python3 finals_fetch.py
      - name: Commit
        run: |
          git config user.name "quizinho-data-bot"
          git config user.email "quizinho-data-bot@users.noreply.github.com"
          git add data_pipeline/raw/finals_wikitext.json.gz
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data: final articles from Wikipedia (for cup-winner grid categories)"
            git pull --rebase origin main
            git push
          fi
