# Fetches the Wikipedia articles behind the hand-checked Under the Radar lists and commits them
# (data_pipeline/raw/radar_wikitext.json.gz) so the lists can be built
# offline. Run from the Actions tab.
name: Fetch Under the Radar lists

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Under the Radar lists
        working-directory: data_pipeline
        run: bash ../scripts/ci_run.sh "Radar" python3 radar_fetch.py
      - name: Commit
        run: |
          git config user.name "quizinho-data-bot"
          git config user.email "quizinho-data-bot@users.noreply.github.com"
          git add data_pipeline/raw/radar_wikitext.json.gz
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data: Under the Radar articles from Wikipedia"
            git pull --rebase origin main
            git push
          fi
