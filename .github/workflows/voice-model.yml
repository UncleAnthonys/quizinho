# Builds the player-name speech model on a Mac exactly as the iPhone app does
# and reports its size, build time and which pronunciations Apple accepts.
name: Voice model probe

on:
  workflow_dispatch:
  push:
    paths:
      - assets/voice/**
      - scripts/voice_model_probe.swift

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - name: Build the model
        run: swift scripts/voice_model_probe.swift assets/voice/vocab.json 2>&1 | tee probe.txt
      - name: Report
        run: |
          while IFS= read -r line; do echo "::notice::${line:0:900}"; done < probe.txt
