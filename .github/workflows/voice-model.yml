# Builds the player-name speech model on a Mac exactly as the iPhone app does
# and reports its size, build time and which pronunciations Apple accepts.
name: Voice model probe

on:
  workflow_dispatch:
  push:
    paths:
      - assets/voice/**
      - scripts/voice_model_probe.swift

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - name: Build the model at several sizes
        run: |
          swiftc -O -o probe scripts/voice_model_probe.swift 2>/dev/null
          # The CI Mac only has US English speech assets, so sizes are tested
          # in en-US (same engine); the phone uses en-GB.
          for args in "1000 1 en-US" "5000 1 en-US" "15000 1 en-US" "0 0 en-US" "0 1 en-US"; do
            ./probe assets/voice/vocab.json $args 2>&1 | tee -a probe.txt
          done
      - name: Report
        run: |
          grep -E "^(run|phrases|export|prepare)" probe.txt | paste -sd'|' - | fold -w 900 | while IFS= read -r line; do echo "::notice::$line"; done
