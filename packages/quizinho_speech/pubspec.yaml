name: quizinho_speech
description: "Quizinho's own speech recogniser: Apple on-device recognition with a custom language model of every player's name on iOS; Google's on-device recognition biased to the answers on Android."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: QuizinhoSpeechPlugin
      android:
        package: com.littlefortstudios.quizinho_speech
        pluginClass: QuizinhoSpeechPlugin
