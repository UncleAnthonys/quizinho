# Cloud iOS build → TestFlight. No local Xcode needed.
#
# Before the first build (see docs/SETUP_IPHONE.md):
#   1. In Codemagic, add an App Store Connect API key named exactly
#      "Quizinho ASC key" (Team/Personal settings → Integrations → Developer Portal).
#   2. APP_STORE_APPLE_ID below is Quizinho's numeric Apple ID (done).
#
# Builds run when a tag starting "ios-" is pushed (git tag ios-1 && git push
# --tags), or from "Start new build" in Codemagic — not on every commit, so
# the free monthly build minutes go on builds worth testing.
#   3. If you change bundle_identifier, change ORG in scripts/bootstrap_platforms.sh to match.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Quizinho ASC key
    environment:
      groups:
        - clips
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.littlefortstudios.quizinho
      vars:
        APP_STORE_APPLE_ID: "6828020010" # Quizinho in App Store Connect → App Information
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: ios-*
          include: true
    scripts:
      - name: Platform folders (if missing)
        script: bash scripts/bootstrap_platforms.sh
      - name: Get packages
        script: flutter pub get
      - name: Commentary clips (TestFlight only)
        script: |
          # Placeholder clips of real pundits: kept encrypted in the public repo,
          # unpacked only here with the CLIPS_KEY secret (env group "clips").
          if [ -n "${CLIPS_KEY:-}" ]; then
            openssl enc -d -aes-256-cbc -md sha256 -pass env:CLIPS_KEY -in private/clips.tar.enc | tar -C assets/clips -xf -
            ls -la assets/clips
          else
            echo "No CLIPS_KEY - building without commentary clips"
          fi
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "Latest TestFlight build: $LATEST"
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
