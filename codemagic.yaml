# Cloud iOS build → TestFlight. No local Xcode needed.
#
# Before the first build (see docs/SETUP_IPHONE.md):
#   1. In Codemagic, add an App Store Connect API key named exactly
#      "Quizinho ASC key" (Team/Personal settings → Integrations → Developer Portal).
#   2. APP_STORE_APPLE_ID below is Quizinho's numeric Apple ID (done).
#
# Builds run when a tag starting "ios-" is pushed (git tag ios-1 && git push
# --tags), or from "Start new build" in Codemagic — not on every commit, so
# the free monthly build minutes go on builds worth testing.
#   3. If you change bundle_identifier, change ORG in scripts/bootstrap_platforms.sh to match.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Quizinho ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.littlefortstudios.quizinho
      vars:
        APP_STORE_APPLE_ID: "6828020010" # Quizinho in App Store Connect → App Information
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: ios-*
          include: true
    scripts:
      - name: Platform folders (if missing)
        script: bash scripts/bootstrap_platforms.sh
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "Latest TestFlight build: $LATEST"
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Android → an app bundle (.aab) to upload to Play Console by hand
  # (Test and release → Testing → Internal testing). Start it from "Start new
  # build" in Codemagic, or push a tag starting "android-".
  # Needs the upload key in Codemagic: Teams → Code signing identities →
  # Android keystores, reference name exactly "quizinho_upload".
  android-release:
    name: Android → Play (app bundle)
    max_build_duration: 45
    instance_type: mac_mini_m2 # the free plan's machine, same as iOS
    environment:
      android_signing:
        - quizinho_upload
      flutter: stable
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: android-*
          include: true
    scripts:
      - name: Platform folders (if missing)
        script: bash scripts/bootstrap_platforms.sh
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build app bundle
        script: |
          # Play needs a bigger version code every upload: Codemagic's build
          # counter does that.
          flutter build appbundle --release --build-number=$((100 + BUILD_NUMBER))
    artifacts:
      - build/app/outputs/bundle/release/*.aab

