name: quizinho
description: "Quizinho — the football party game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  sensors_plus: ^6.1.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/db/
    - assets/sounds/
    - assets/packs/

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed_700Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed_900Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
