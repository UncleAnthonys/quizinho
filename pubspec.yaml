name: quizinho
description: "Quizinho — the football party game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  audioplayers: ^6.1.0
  in_app_purchase: ^3.2.0
  http: ^1.2.2
  web: ^1.1.0
  qr_flutter: ^4.1.0
  app_links: ^6.3.3
  shared_preferences: ^2.3.2
  sensors_plus: ^6.1.0
  speech_to_text: ^7.0.0
  quizinho_speech:
    path: packages/quizinho_speech

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# App icon for iPhone, Android and the web page, from the crest
# (rendered by test/screenshots_test.dart). Applied in scripts/bootstrap_platforms.sh.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0A3A28"
    theme_color: "#0A3A28"

flutter:
  uses-material-design: true

  assets:
    - assets/db/
    - assets/sounds/
    - assets/packs/
    - assets/voice/
    - assets/clips/

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed_700Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed_800ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BarlowCondensed_900Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
